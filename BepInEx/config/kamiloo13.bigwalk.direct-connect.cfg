## Settings file was created by plugin Direct Connect v1.0.0
## Plugin GUID: kamiloo13.bigwalk.direct-connect

[General]

## Language of the mod's texts. 'auto' follows the game's language (falls back to the system language). Or force one of: en, pl, de, fr, es, it, pt, ru, uk, cs, tr, ja, ko, zh-Hans, zh-Hant.
# Setting type: String
# Default value: auto
Language = auto

[Network]

## When to raise the send rate. DirectIpOnly = only when connected by IP (client) / when every remote player is connected by IP (host). Always = every session (players without the mod may see jittery movement). Off = never.
# Setting type: TuningMode
# Default value: DirectIpOnly
# Acceptable values: DirectIpOnly, Always, Off
SendRateMode = DirectIpOnly

## Mirror send rate in Hz (game default: 30). All players should use the same value.
# Setting type: Int32
# Default value: 60
# Acceptable value range: From 30 to 120
SendRate = 60

## Flush KCP reliable data every frame instead of every 10 ms. Works without the mod on the other side.
# Setting type: Boolean
# Default value: true
FlushKcpEveryFrame = true

[Warnings]

## Key that shows/hides the game's warning banners, e.g. 'No network connection' (Unity KeyCode name: F5, F6, Insert, ...).
# Setting type: String
# Default value: F5
ToggleKey = F5

## Hide warning banners from the start, without pressing the key first.
# Setting type: Boolean
# Default value: false
HiddenOnStart = false

